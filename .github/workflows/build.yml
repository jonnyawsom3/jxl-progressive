name: Build Windows x64

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C target-feature=+crt-static"
  VCPKG_DEFAULT_TRIPLET: "x64-windows-static"

jobs:
  build:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          vcpkg install ffmpeg:x64-windows-static

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64-static

      - name: Build release executable
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/jxl_progressive.exe"

          if (!(Test-Path $exe)) {
            Write-Error "Executable was not produced: $exe"
            exit 1
          }

          Write-Host "Built:"
          Get-Item $exe | Format-List FullName,Length

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: jxl-progressive-windows-x64
          path: target/x86_64-pc-windows-msvc/release/jxl_progressive.exe
